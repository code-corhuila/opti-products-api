# The service of the products domain. Reachable only inside the platform network: no published port.
name: opti-products-api

services:
  products-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/products-api:local
    environment:
      DATABASE_URL: jdbc:postgresql://products-db:5432/${PRODUCTS_DB_NAME:-products}
      DATABASE_USER: ${PRODUCTS_DB_USER:-products_owner}
      DATABASE_PASSWORD: ${PRODUCTS_DB_PASSWORD:?set PRODUCTS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY (public key of the identity service)}
      FRAME_IMAGES_DIR: /data/frame-images
    volumes:
      # Frame photos (HU-16): written here, served read-only by the gateway from the same volume.
      - frame-images:/data/frame-images
    networks:
      - platform
    expose:
      - "8080"
    restart: unless-stopped

networks:
  platform:
    external: true

volumes:
  frame-images:
